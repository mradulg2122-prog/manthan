# =============================================================================
# EventFlow AI — Render Blueprint Configuration
# =============================================================================

databases:
  - name: eventflow-db
    databaseName: eventflow
    user: eventflow_user
    plan: free

services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend (Web Service)
  # Automatic Watcher runs via FastAPI startup hook (on_startup)
  # ---------------------------------------------------------------------------
  - type: web
    name: eventflow-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # TanStack Start Frontend (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: eventflow-frontend
    runtime: node
    buildCommand: cd youth-parliament-portal && npm install && npm run build
    startCommand: cd youth-parliament-portal && npm run start
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: eventflow-backend
          property: url
